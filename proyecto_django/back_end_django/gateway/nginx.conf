# ─────────────────────────────────────────────
# Gateway nginx — punto único de entrada a los microservicios.
#
# Acceso (sin cambiar de puerto, todo por el gateway en :80):
#   http://localhost/api/auth/*      → servicio_auth:8000/api/auth/*, /swagger/, ...
#   http://localhost/api/usuarios/*  → servicio_usuarios:8000/...
#   http://localhost/api/productos/* → servicio_productos:8000/...
#
# Ejemplos:
#   http://localhost/api/auth/swagger/       → Swagger de auth
#   http://localhost/api/usuarios/swagger/   → Swagger de usuarios
#   http://localhost/api/productos/swagger/  → Swagger de productos
#   http://localhost/api/auth/api/auth/token/      → login (auth)
#   http://localhost/api/usuarios/api/users/       → usuarios
#   http://localhost/api/productos/api/products/   → productos
#
# Cómo funciona: el gateway QUITA el prefijo /api/<servicio> antes de
# reenviar (rewrite ... break). Cada Django lleva
# FORCE_SCRIPT_NAME=/api/<servicio> (ver docker-compose.yml) y por eso
# reverse()/Swagger generan URLs CON prefijo, que son las que el
# navegador usa vía gateway. Ejemplo completo:
#   navegador → GET /api/productos/swagger/  →  Django ve /swagger/ (200)
#   el HTML pide /api/productos/swagger.json → Django ve /swagger.json
#   el JSON declara paths /api/productos/api/... → Try-it-out funciona.
# Los redirects de Django (ej. APPEND_SLASH /swagger → /swagger/) se
# re-prefijan con proxy_redirect para no perder /api/<servicio>.
# ─────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # DNS dinámico de Docker: re-resuelve los servicios en cada petición
    # (sin caché de IPs), así el gateway sobrevive a reinicios de los
    # contenedores que cambian sus IPs internas.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Límites y tiempos razonables para una API REST
    client_max_body_size 10m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # ── Raíz: mapa de servicios ─────────────────────────────
    location = / {
        default_type application/json;
        return 200 '{"gateway":"ok","base":"/api","servicios":{"auth":"/api/auth/","usuarios":"/api/usuarios/","productos":"/api/productos/"},"swagger":{"auth":"/api/auth/swagger/","usuarios":"/api/usuarios/swagger/","productos":"/api/productos/swagger/"},"ejemplos":{"login":"POST /api/auth/api/auth/token/","users":"GET /api/usuarios/api/users/","products":"GET /api/productos/api/products/"}}';
    }

    # ── Redirecciones de compatibilidad (esquema anterior) ──
    # Antes: /auth/, /usuarios/, /productos/ con strip del prefijo.
    # Ahora: canónico /api/<servicio>/. Se redirige para no romper nada.
    location = /auth { return 301 /api/auth/; }
    location /auth/ { return 301 /api/auth/$is_args$args; }
    location = /usuarios { return 301 /api/usuarios/; }
    location /usuarios/ { return 301 /api/usuarios/$is_args$args; }
    location = /productos { return 301 /api/productos/; }
    location /productos/ { return 301 /api/productos/$is_args$args; }

    # ── servicio_auth (canónico) ────────────────────────────
    location = /api/auth { return 301 /api/auth/; }
    location /api/auth/ {
        set $backend servicio_auth:8000;
        rewrite ^/api/auth/(.*)$ /$1 break;
        proxy_pass http://$backend;
        proxy_redirect / /api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /api/auth;
        proxy_set_header X-Script-Name /api/auth;
    }

    # ── servicio_usuarios (canónico) ────────────────────────
    location = /api/usuarios { return 301 /api/usuarios/; }
    location /api/usuarios/ {
        set $backend servicio_usuarios:8000;
        rewrite ^/api/usuarios/(.*)$ /$1 break;
        proxy_pass http://$backend;
        proxy_redirect / /api/usuarios/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /api/usuarios;
        proxy_set_header X-Script-Name /api/usuarios;
    }

    # ── servicio_productos (canónico) ───────────────────────
    location = /api/productos { return 301 /api/productos/; }
    location /api/productos/ {
        set $backend servicio_productos:8000;
        rewrite ^/api/productos/(.*)$ /$1 break;
        proxy_pass http://$backend;
        proxy_redirect / /api/productos/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /api/productos;
        proxy_set_header X-Script-Name /api/productos;
    }
}
